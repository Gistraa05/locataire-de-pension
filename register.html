<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Kost Digital Floral</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        pinkUtama: '#F8BBD0', 
                        putih: '#FFFFFF', 
                        abu: '#F5F5F5', 
                        aksen: '#E91E63' 
                    }
                } 
            } 
        }
    </script>
    <style>
        .floral-element {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .animate-floral {
            animation: float 8s ease-in-out infinite;
        }

        .input-focus-effect:focus-within {
            box-shadow: 0 10px 20px -5px rgba(233, 30, 99, 0.1);
        }
    </style>
</head>
<body class="bg-abu min-h-screen flex items-center justify-center p-4">

    <div class="flex flex-col md:flex-row w-full max-w-5xl bg-putih rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden border border-pinkUtama/20 relative">
        
        <!-- Sisi Kiri (Gradient & Info) -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-pinkUtama via-[#fce4ec] to-aksen p-10 md:p-12 text-gray-800 flex flex-col justify-between relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-putih/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-aksen/10 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <div class="flex items-center gap-2 mb-8">
                    <div class="bg-putih p-2 rounded-xl shadow-sm">
                        <i class='bx bxs-home-heart text-3xl text-aksen'></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-gray-900">Kost Sakura.</span>
                </div>
                
                <h1 class="text-3xl md:text-4xl font-extrabold leading-tight mb-6">Mulai Perjalanan Baru <br><span class="text-aksen font-serif italic">Bersama Kami.</span></h1>
                
                <p class="text-sm font-medium text-gray-700 leading-relaxed">Bergabunglah dengan komunitas Kost Sakura dan nikmati kemudahan pengelolaan hunian Anda secara digital.</p>
            </div>

            <div class="relative z-10 mt-8">
                <a href="index.html" class="inline-flex items-center gap-2 text-sm font-bold text-gray-800 hover:text-aksen transition-all">
                    <i class='bx bx-arrow-back'></i> Kembali ke Login
                </a>
            </div>
        </div>

        <!-- Sisi Kanan (Form Daftar) -->
        <div class="w-full md:w-7/12 p-10 md:p-16 flex flex-col justify-center bg-white relative overflow-hidden">
            
            <!-- Floral elements like index.html -->
            <div class="floral-element animate-floral top-4 left-10 text-3xl opacity-10">🌸</div>
            <div class="floral-element animate-floral top-10 right-10 text-5xl opacity-20">🪷</div>
            <div class="floral-element animate-floral bottom-10 left-32 text-3xl opacity-15">🌸</div>

            <div class="max-w-sm mx-auto w-full relative z-10">
                <div class="mb-10 text-center md:text-left">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Buat Akun Baru</h2>
                    <p class="text-gray-400 text-sm">Lengkapi data diri Anda untuk mendaftar.</p>
                </div>

                <form action="#" class="space-y-5">
                    <!-- Nama Lengkap -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 ml-1">Nama Lengkap</label>
                        <div class="group relative input-focus-effect">
                            <i class='bx bx-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-aksen transition text-xl'></i>
                            <input type="text" required 
                                class="w-full pl-12 pr-4 py-3 bg-abu/50 border-2 border-transparent rounded-2xl focus:border-pinkUtama focus:bg-white outline-none transition-all duration-300 shadow-inner" 
                                placeholder="Nama Lengkap Anda">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 ml-1">Email</label>
                        <div class="group relative input-focus-effect">
                            <i class='bx bx-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-aksen transition text-xl'></i>
                            <input type="email" required 
                                class="w-full pl-12 pr-4 py-3 bg-abu/50 border-2 border-transparent rounded-2xl focus:border-pinkUtama focus:bg-white outline-none transition-all duration-300 shadow-inner" 
                                placeholder="nama@email.com">
                        </div>
                    </div>

                    <!-- Nomor Telepon -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 ml-1">Nomor Telepon</label>
                        <div class="group relative input-focus-effect">
                            <i class='bx bx-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-aksen transition text-xl'></i>
                            <input type="tel" required 
                                class="w-full pl-12 pr-4 py-3 bg-abu/50 border-2 border-transparent rounded-2xl focus:border-pinkUtama focus:bg-white outline-none transition-all duration-300 shadow-inner" 
                                placeholder="0812...">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 ml-1">Password</label>
                            <div class="group relative input-focus-effect">
                                <i class='bx bx-lock-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-aksen transition text-xl'></i>
                                <input type="password" required 
                                    class="w-full pl-12 pr-4 py-3 bg-abu/50 border-2 border-transparent rounded-2xl focus:border-pinkUtama focus:bg-white outline-none transition-all duration-300 shadow-inner text-sm" 
                                    placeholder="••••••">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 ml-1">Konfirmasi</label>
                            <div class="group relative input-focus-effect">
                                <i class='bx bx-lock-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-aksen transition text-xl'></i>
                                <input type="password" required 
                                    class="w-full pl-12 pr-4 py-3 bg-abu/50 border-2 border-transparent rounded-2xl focus:border-pinkUtama focus:bg-white outline-none transition-all duration-300 shadow-inner text-sm" 
                                    placeholder="••••••">
                            </div>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-aksen text-putih py-4 rounded-2xl font-bold hover:bg-pink-700 transition-all duration-300 shadow-xl shadow-pink-200 hover:shadow-pink-400 transform hover:-translate-y-1 active:scale-95 mt-4">
                        Daftar Sekarang
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm text-gray-400">Sudah punya akun? <a href="index.html" class="text-aksen font-bold hover:underline">Masuk di sini</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Pendaftaran Berhasil! Silakan tunggu konfirmasi dari Admin.");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
